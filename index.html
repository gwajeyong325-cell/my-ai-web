<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Web</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .emoji { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 28px; color: #1a1a2e; margin-bottom: 12px; }
    p { color: #666; line-height: 1.7; margin-bottom: 24px; }
    .badge {
      display: inline-block;
      background: #667eea;
      color: white;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">👋</div>
    <h1>안녕하세요!</h1>
    <p>GitHub Pages로 배포된 나의 첫 번째 랜딩페이지입니다.<br>AI와 웹 개발을 함께 배우고 있습니다.</p>
    <span class="badge">🚀 Deployed with GitHub Actions</span>
  </div>
</body>
</html>
